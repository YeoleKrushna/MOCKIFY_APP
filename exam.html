<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <link rel="canonical" href="https://mockify.tech/exam.html">
  <title>Mockify Exam | Private Practice Session</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='32' y2='32'%3E%3Cstop stop-color='%236c63ff'/%3E%3Cstop offset='1' stop-color='%23ff6584'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M9 20V12L16 17L23 12V20' stroke='white' stroke-width='2.3' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c27;
      --border: #2a2a3d;
      --accent: #6c63ff;
      --accent2: #ff6584;
      --accent3: #43e97b;
      --text: #e8e8f0;
      --text-dim: #8888aa;
      --danger: #ff4d6d;
      --warn: #ffd166;
      --success: #43e97b;
      --radius: 14px;
      --radius-sm: 8px;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(108,99,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(108,99,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none; z-index: 0;
    }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

    .page { min-height: 100vh; position: relative; z-index: 1; display: flex; flex-direction: column; }

    .exam-header {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      background: rgba(19,19,26,0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      position: sticky; top: 0; z-index: 30;
      flex-wrap: wrap;
    }

    .exam-title {
      display: flex; align-items: center; gap: 12px;
    }

    .exam-title .logo-mark { display: inline-flex; }

    .exam-title-text { display: flex; flex-direction: column; gap: 4px; }

    .exam-title-text span {
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .exam-title-text strong {
      font-family: 'DM Serif Display', serif;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }

    .timer-display {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
    }

    .timer-display.warning { border-color: rgba(255,209,102,0.45); color: var(--warn); }
    .timer-display.danger { border-color: rgba(255,77,109,0.6); color: var(--danger); animation: timer-pulse 1s ease-in-out infinite; }
    .timer-display .timer-state { font-family: 'DM Sans', sans-serif; font-size: .72rem; font-weight: 700; letter-spacing: .04em; }
    .sound-toggle { width: 42px; height: 42px; border: 1px solid var(--border); border-radius: 50%; background: var(--surface2); color: var(--text-dim); cursor: pointer; transition: transform .18s, border-color .18s, color .18s; }
    .sound-toggle:hover { transform: translateY(-1px); border-color: var(--accent); color: var(--text); }

    .submit-exam-btn {
      background: linear-gradient(135deg, var(--accent3), #06d6a0);
      color: #000;
      font-weight: 700;
      border: none; border-radius: var(--radius-sm);
      padding: 12px 28px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 20px rgba(67,233,123,0.3);
    }

    .submit-exam-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(67,233,123,0.4); }

    .exam-body {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 24px 40px;
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 24px;
    }

    .nav-panel, .question-area {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .nav-panel { padding: 20px; height: fit-content; }

    .nav-label {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 12px;
    }

    .question-area { padding: 32px; }

    .q-counter {
      font-size: 0.78rem; color: var(--text-dim);
      margin-bottom: 12px;
    }

    .exam-progress { height: 5px; overflow: hidden; border-radius: 99px; background: var(--surface2); margin: 0 0 22px; }
    .exam-progress > span { display: block; height: 100%; width: 10%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .24s ease; }

    .q-text {
      font-size: 1.1rem; line-height: 1.7;
      margin-bottom: 28px;
      color: var(--text);
    }

    .options-grid { display: flex; flex-direction: column; gap: 10px; }

    .option-btn {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 18px;
      background: var(--surface2);
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
      width: 100%;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
    }

    .option-btn:hover:not(.selected) { border-color: rgba(108,99,255,0.4); }

    .option-btn.selected {
      border-color: var(--accent);
      background: rgba(108,99,255,0.1);
      color: var(--text);
    }

    .question-area.is-changing { animation: question-in .2s ease both; }

    .option-key {
      width: 30px; height: 30px; min-width: 30px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem; font-weight: 500;
      color: var(--text-dim);
      transition: all 0.15s;
    }

    .option-btn.selected .option-key {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .exam-nav {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 28px; padding-top: 24px;
      border-top: 1px solid var(--border);
      gap: 12px;
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 13px 24px;
      border: none; border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }

    .btn-secondary {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

    .q-nav-btn {
      width: 40px; height: 40px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text-dim);
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem; font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .q-nav-btn.answered { border-color: var(--accent); color: var(--accent); background: rgba(108,99,255,0.1); }
    .q-nav-btn.current { background: var(--accent); color: #fff; border-color: var(--accent); }

    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 60;
      padding: 20px;
    }

    .modal-overlay.active { display: flex; }

    .modal-box {
      width: 100%; max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .modal-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 10px; }
    .modal-body { color: var(--text-dim); line-height: 1.6; margin-bottom: 18px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }

    .loading-overlay {
      position: fixed; inset: 0;
      background: rgba(10,10,15,0.9);
      backdrop-filter: blur(8px);
      z-index: 70;
      display: none;
      flex-direction: column;
      align-items: center; justify-content: center;
      gap: 24px;
    }

    .loading-overlay.active { display: flex; }

    .loading-icon {
      width: 70px; height: 70px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .loading-text {
      font-family: 'DM Serif Display', serif;
      font-size: 1.5rem;
      color: var(--text);
    }

    .loading-sub { color: var(--text-dim); font-size: 0.875rem; }

    .error-box {
      width: 100%;
      max-width: 1120px;
      margin: 24px auto 0;
      background: rgba(255,77,109,0.12);
      border: 1px solid rgba(255,77,109,0.3);
      color: var(--danger);
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes question-in { from { opacity: .35; transform: translateX(8px); } to { opacity: 1; transform: none; } }
    @keyframes timer-pulse { 50% { box-shadow: 0 0 0 5px rgba(255,77,109,.1); } }

    @media (max-width: 900px) {
      .exam-body { grid-template-columns: 1fr; }
    }

    @media (max-width: 700px) {
      .q-nav-btn { width: 36px; height: 36px; }
      .exam-header { padding: 14px 16px; }
      .exam-body { padding: 20px 16px 32px; }
      .question-area { padding: 22px; }
      .exam-nav { flex-direction: column; }
      .exam-nav .btn { width: 100%; }
      .exam-title { max-width: calc(100% - 58px); }
      .timer-display { order: 3; flex: 1; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="loading-overlay" id="loading-overlay">
    <div class="loading-icon"></div>
    <div class="loading-text">Preparing your exam...</div>
    <div class="loading-sub" id="loading-sub">Loading questions</div>
  </div>

  <div class="modal-overlay" id="modal-overlay" role="presentation">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-body">
      <div class="modal-title" id="modal-title" tabindex="-1">Are you sure?</div>
      <div class="modal-body" id="modal-body">This action cannot be undone.</div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="modal-cancel-btn" onclick="closeModal()">Continue test</button>
        <button type="button" class="btn btn-secondary" id="modal-confirm-btn">Confirm</button>
      </div>
    </div>
  </div>

  <div id="error-box" class="error-box"></div>

  <div class="page">
    <div class="exam-header">
      <div class="exam-title">
        <span class="logo-mark" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 32 32" fill="none">
            <rect width="32" height="32" rx="9" fill="url(#eg1)"/>
            <path d="M9 20V12L16 17L23 12V20" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
            <defs><linearGradient id="eg1" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#6c63ff"/><stop offset="1" stop-color="#ff6584"/></linearGradient></defs>
          </svg>
        </span>
        <div class="exam-title-text">
          <span>Mockify Exam</span>
          <strong id="exam-topic">Loading...</strong>
        </div>
      </div>
      <button class="sound-toggle" id="sound-toggle" type="button" aria-pressed="false" aria-label="Enable final ten-second timer sound" title="Timer sound is off">🔇</button>
      <div class="timer-display" id="timer-display" aria-live="polite">
        <span>⏱</span>
        <span id="timer-text">--:--</span>
        <span class="timer-state" id="timer-state"></span>
      </div>
      <button type="button" class="submit-exam-btn" onclick="confirmSubmit(event)">Submit Exam</button>
    </div>

    <div class="exam-body">
      <div class="nav-panel">
        <div class="nav-label">Questions</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px" id="q-nav-grid"></div>
        <div style="margin-top:18px">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
            <div style="width:12px;height:12px;border-radius:2px;background:var(--accent)"></div>
            <span style="font-size:0.75rem;color:var(--text-dim)">Answered</span>
          </div>
          <div style="display:flex;align-items:center;gap:6px">
            <div style="width:12px;height:12px;border-radius:2px;border:2px solid var(--border)"></div>
            <span style="font-size:0.75rem;color:var(--text-dim)">Unanswered</span>
          </div>
        </div>
      </div>

      <div class="question-area">
        <div class="q-counter" id="q-counter">Question 1 of 10</div>
        <div class="exam-progress" aria-hidden="true"><span id="exam-progress-fill"></span></div>
        <div class="q-text" id="q-text">Loading question...</div>
        <div class="options-grid" id="options-grid"></div>
        <div class="exam-nav">
          <button type="button" class="btn btn-secondary" onclick="prevQuestion()">← Previous</button>
          <button type="button" class="btn btn-secondary" onclick="nextQuestion()">Next →</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = '/api';
    let examQuestions = [];
    let examAnswers = {};
    let examMockId = null;
    let examTopic = '';
    let currentQuestion = 0;
    let timerInterval = null;
    let timerSeconds = 0;
    let timerEnabled = true;
    let examStartTime = null;
    let examSubmitInFlight = false;
    let soundEnabled = false;
    let audioContext = null;
    let lastModalTrigger = null;

    function escapeHtml(s) {
      if (s == null) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function showLoading(msg = 'Preparing your exam...', sub = 'Loading questions') {
      document.getElementById('loading-overlay').classList.add('active');
      document.querySelector('.loading-text').textContent = msg;
      document.getElementById('loading-sub').textContent = sub;
    }

    function hideLoading() {
      document.getElementById('loading-overlay').classList.remove('active');
    }

    function showError(message) {
      const el = document.getElementById('error-box');
      el.textContent = message;
      el.style.display = 'block';
    }

    function openModal(title, body, onConfirm) {
      lastModalTrigger = document.activeElement;
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').textContent = body;
      document.getElementById('modal-confirm-btn').onclick = () => { closeModal(); onConfirm(); };
      document.getElementById('modal-overlay').classList.add('active');
      requestAnimationFrame(() => document.getElementById('modal-title').focus());
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('active');
      if (lastModalTrigger && document.contains(lastModalTrigger)) lastModalTrigger.focus();
    }

    function updateSoundToggle() {
      const button = document.getElementById('sound-toggle');
      button.textContent = soundEnabled ? '🔊' : '🔇';
      button.setAttribute('aria-pressed', String(soundEnabled));
      button.setAttribute('aria-label', soundEnabled ? 'Disable final ten-second timer sound' : 'Enable final ten-second timer sound');
      button.title = soundEnabled ? 'Timer sound is on' : 'Timer sound is off';
    }

    async function toggleSound() {
      soundEnabled = !soundEnabled;
      localStorage.setItem('mockify-sound-enabled', String(soundEnabled));
      updateSoundToggle();
      if (soundEnabled) {
        try {
          audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
          await audioContext.resume();
        } catch (e) { soundEnabled = false; updateSoundToggle(); }
      }
    }

    function playTimerTick() {
      if (!soundEnabled || !audioContext || audioContext.state !== 'running') return;
      try {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.frequency.value = 760;
        gain.gain.setValueAtTime(.025, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(.001, audioContext.currentTime + .06);
        oscillator.connect(gain).connect(audioContext.destination);
        oscillator.start(); oscillator.stop(audioContext.currentTime + .065);
      } catch (e) { /* Visual timer feedback remains available. */ }
    }

    async function apiCall(method, path, body) {
      const opts = {
        method,
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include'
      };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(API + path, opts);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    function openResultPage(resultId, resultData = null) {
      if (resultData) {
        sessionStorage.setItem('mockify_latest_result', JSON.stringify(resultData));
      }
      window.location.href = resultId ? `result.html?result_id=${resultId}` : 'result.html';
    }

    function loadExam(data) {
      examQuestions = data.questions || [];
      examMockId = data.mock_id;
      examTopic = data.topic || 'Mock Test';
      document.getElementById('exam-topic').textContent = examTopic;
      buildNavGrid();
      renderQuestion(0);

      const timerMinutes = Number(data.timer_minutes);
      if (Number.isFinite(timerMinutes) && timerMinutes > 0) {
        timerEnabled = true;
        timerSeconds = timerMinutes * 60;
      } else {
        timerEnabled = false;
        timerSeconds = 0;
      }

      examStartTime = Date.now();
      startTimer();
    }

    function buildNavGrid() {
      const grid = document.getElementById('q-nav-grid');
      grid.innerHTML = examQuestions.map((_, i) => `
        <button type="button" class="q-nav-btn ${i === 0 ? 'current' : ''}" id="qnav-${i}" onclick="goToQuestion(${i})">${i + 1}</button>
      `).join('');
    }

    function renderQuestion(idx) {
      const q = examQuestions[idx];
      if (!q) return;
      document.getElementById('q-counter').textContent = `Question ${idx + 1} of ${examQuestions.length}`;
      document.getElementById('exam-progress-fill').style.width = `${((idx + 1) / examQuestions.length) * 100}%`;
      document.getElementById('q-text').textContent = q.question;

      const grid = document.getElementById('options-grid');
      grid.innerHTML = ['A', 'B', 'C', 'D'].map(key => {
        const selected = examAnswers[idx] === key;
        return `<button type="button" class="option-btn ${selected ? 'selected' : ''}" onclick="selectAnswer(${idx}, '${key}')">
          <span class="option-key">${key}</span>
          <span>${escapeHtml(q.options[key])}</span>
        </button>`;
      }).join('');

      document.querySelectorAll('.q-nav-btn').forEach((b, i) => {
        b.classList.remove('current', 'answered');
        if (i === idx) b.classList.add('current');
        else if (examAnswers[i]) b.classList.add('answered');
      });

      currentQuestion = idx;
      const area = document.querySelector('.question-area');
      area.classList.remove('is-changing');
      requestAnimationFrame(() => area.classList.add('is-changing'));
    }

    function selectAnswer(qIdx, key) {
      examAnswers[qIdx] = key;
      renderQuestion(qIdx);
    }

    function goToQuestion(idx) { renderQuestion(idx); }
    function nextQuestion() { if (currentQuestion < examQuestions.length - 1) renderQuestion(currentQuestion + 1); }
    function prevQuestion() { if (currentQuestion > 0) renderQuestion(currentQuestion - 1); }

    function updateTimerDisplay() {
      const el = document.getElementById('timer-display');
      const text = document.getElementById('timer-text');

      el.classList.remove('warning', 'danger');

      if (!timerEnabled) {
        text.textContent = 'No limit';
        document.getElementById('timer-state').textContent = '';
        return;
      }

      text.textContent = formatTime(timerSeconds);
      const state = document.getElementById('timer-state');
      if (timerSeconds <= 10) { el.classList.add('danger'); state.textContent = 'FINAL'; }
      else if (timerSeconds <= 60) { el.classList.add('warning'); state.textContent = '1 MIN'; }
      else state.textContent = '';
    }

    function startTimer() {
      clearInterval(timerInterval);
      updateTimerDisplay();

      if (!timerEnabled) return;

      timerInterval = setInterval(() => {
        timerSeconds--;
        updateTimerDisplay();

        if (timerSeconds > 0 && timerSeconds <= 10) playTimerTick();

        if (timerSeconds <= 0) {
          clearInterval(timerInterval);
          submitExam();
        }
      }, 1000);
    }

    function confirmSubmit(event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      const answered = Object.keys(examAnswers).length;
      const unanswered = examQuestions.length - answered;
      if (unanswered > 0) {
        openModal('Submit Exam?', `You have ${unanswered} unanswered question(s). Are you sure you want to submit?`, submitExam);
      } else {
        submitExam();
      }
    }

    async function submitExam() {
      if (examSubmitInFlight) return;
      examSubmitInFlight = true;
      clearInterval(timerInterval);
      showLoading('Evaluating answers...', 'Calculating your score');

      try {
        const data = await apiCall('POST', '/results/submit', {
          mock_id: examMockId,
          answers: examAnswers,
          time_taken: Math.round((Date.now() - examStartTime) / 1000)
        });
        openResultPage(data.result_id, data);
      } catch (e) {
        showError("We couldn't submit your test right now. Your answers are still on screen—check your connection and try again.");
      } finally {
        examSubmitInFlight = false;
        hideLoading();
      }
    }

    async function init() {
      showLoading();
      const params = new URLSearchParams(window.location.search);
      const mockId = params.get('mock_id');
      const stored = sessionStorage.getItem('mockify_latest_exam');

      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          if (!mockId || String(parsed.mock_id) === String(mockId)) {
            loadExam(parsed);
            sessionStorage.removeItem('mockify_latest_exam');
            hideLoading();
            return;
          }
        } catch (e) {}
      }

      if (!mockId) {
        hideLoading();
        showError('No mock selected. Go back to the dashboard and generate a mock first.');
        return;
      }

      try {
        const data = await apiCall('GET', `/mock/${mockId}`);
        loadExam(data);
      } catch (e) {
        showError(e.message);
      } finally {
        hideLoading();
      }
    }

    document.getElementById('sound-toggle').addEventListener('click', toggleSound);
    document.addEventListener('keydown', (event) => {
      const modal = document.getElementById('modal-overlay');
      if (event.key === 'Tab' && modal.classList.contains('active')) {
        const focusable = [...modal.querySelectorAll('button:not([disabled]), [href], input:not([disabled])')];
        const first = focusable[0], last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
        return;
      }
      if (event.key === 'Escape' && document.getElementById('modal-overlay').classList.contains('active')) return closeModal();
      if (event.target.matches('input, textarea, select, button')) return;
      const choice = { '1': 'A', '2': 'B', '3': 'C', '4': 'D', a: 'A', b: 'B', c: 'C', d: 'D' }[event.key.toLowerCase()];
      if (choice && examQuestions.length) selectAnswer(currentQuestion, choice);
      if (event.key === 'ArrowRight') nextQuestion();
      if (event.key === 'ArrowLeft') prevQuestion();
    });
    window.addEventListener('pagehide', () => { clearInterval(timerInterval); if (audioContext) audioContext.close().catch(() => {}); }, { once: true });
    soundEnabled = localStorage.getItem('mockify-sound-enabled') === 'true';
    updateSoundToggle();
    init();
  </script>
</body>
</html>
