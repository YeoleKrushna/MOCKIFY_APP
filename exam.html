<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<script>
(function () {
  try {
    const saved = localStorage.getItem('mockify-theme');
    document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>
  <meta name="theme-color" content="#0a0a0f">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <link rel="canonical" href="https://mockify.tech/exam.html">
  <title>Mockify Exam | Private Practice Session</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c27;
      --border: #2a2a3d;
      --accent: #6c63ff;
      --accent2: #ff6584;
      --accent3: #43e97b;
      --text: #e8e8f0;
      --text-dim: #8888aa;
      --danger: #ff4d6d;
      --warn: #ffd166;
      --success: #43e97b;
      --radius: 14px;
      --radius-sm: 8px;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(108,99,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(108,99,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none; z-index: 0;
    }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

    .page { min-height: 100vh; position: relative; z-index: 1; display: flex; flex-direction: column; }

    .exam-header {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      background: rgba(19,19,26,0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      position: sticky; top: 0; z-index: 30;
      flex-wrap: wrap;
    }

    .exam-title {
      display: flex; align-items: center; gap: 12px;
    }

    .exam-title .logo-mark { display: inline-flex; }

    .exam-title-text { display: flex; flex-direction: column; gap: 4px; }

    .exam-title-text span {
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .exam-title-text strong {
      font-family: 'DM Serif Display', serif;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }

    .timer-display {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
    }

    .timer-display.warning { border-color: rgba(255,209,102,0.45); color: var(--warn); }
    .timer-display.danger { border-color: rgba(255,77,109,0.6); color: var(--danger); animation: timer-pulse 1s ease-in-out infinite; }
    .timer-display .timer-state { font-family: 'DM Sans', sans-serif; font-size: .72rem; font-weight: 700; letter-spacing: .04em; }
    .sound-toggle { width: 42px; height: 42px; border: 1px solid var(--border); border-radius: 50%; background: var(--surface2); color: var(--text-dim); cursor: pointer; transition: transform .18s, border-color .18s, color .18s; display:inline-flex; align-items:center; justify-content:center; }
    .sound-toggle svg, .timer-display svg { width: 18px; height: 18px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .sound-toggle:hover { transform: translateY(-1px); border-color: var(--accent); color: var(--text); }

    .submit-exam-btn {
      background: linear-gradient(135deg, var(--accent3), #06d6a0);
      color: #000;
      font-weight: 700;
      border: none; border-radius: var(--radius-sm);
      padding: 12px 28px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 20px rgba(67,233,123,0.3);
    }

    .submit-exam-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(67,233,123,0.4); }

    .exam-body {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 24px 40px;
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 24px;
    }

    .nav-panel, .question-area {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .nav-panel { padding: 20px; height: fit-content; }

    .nav-label {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 12px;
    }

    .question-area { padding: 32px; }

    .q-counter {
      font-size: 0.78rem; color: var(--text-dim);
      margin-bottom: 12px;
    }

    .exam-progress { height: 5px; overflow: hidden; border-radius: 99px; background: var(--surface2); margin: 0 0 22px; }
    .exam-progress > span { display: block; height: 100%; width: 10%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .24s ease; }

    .q-text {
      font-size: 1.1rem; line-height: 1.7;
      margin-bottom: 28px;
      color: var(--text);
    }

    .options-grid { display: flex; flex-direction: column; gap: 10px; }

    .option-btn {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 18px;
      background: var(--surface2);
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
      width: 100%;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
    }

    .option-btn:hover:not(.selected) { border-color: rgba(108,99,255,0.4); }

    .option-btn.selected {
      border-color: var(--accent);
      background: rgba(108,99,255,0.1);
      color: var(--text);
    }

    .question-area.is-changing { animation: question-in .2s ease both; }

    .option-key {
      width: 30px; height: 30px; min-width: 30px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem; font-weight: 500;
      color: var(--text-dim);
      transition: all 0.15s;
    }

    .option-btn.selected .option-key {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .exam-nav {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 28px; padding-top: 24px;
      border-top: 1px solid var(--border);
      gap: 12px;
    }

    .last-question-hint {
      flex: 1;
      text-align: center;
      color: var(--text-dim);
      font-size: 0.82rem;
      line-height: 1.45;
      padding: 0 8px;
      display: none;
    }

    .last-question-hint.visible {
      display: block;
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 13px 24px;
      border: none; border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
    }

    .btn-secondary {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

    .q-nav-btn {
      width: 40px; height: 40px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text-dim);
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem; font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }

    .q-nav-btn.answered { border-color: var(--accent); color: var(--accent); background: rgba(108,99,255,0.1); }
    .q-nav-btn.current { background: var(--accent); color: #fff; border-color: var(--accent); }

    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 60;
      padding: 20px;
    }

    .modal-overlay.active { display: flex; }

    .modal-box {
      width: 100%; max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .modal-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 10px; }
    .modal-body { color: var(--text-dim); line-height: 1.6; margin-bottom: 18px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }

    .loading-overlay {
      position: fixed; inset: 0;
      background: rgba(10,10,15,0.9);
      backdrop-filter: blur(8px);
      z-index: 70;
      display: none;
      flex-direction: column;
      align-items: center; justify-content: center;
      gap: 24px;
    }

    .loading-overlay.active { display: flex; }

    .loading-icon {
      width: 70px; height: 70px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .loading-text {
      font-family: 'DM Serif Display', serif;
      font-size: 1.5rem;
      color: var(--text);
    }

    .loading-sub { color: var(--text-dim); font-size: 0.875rem; }

    .error-box {
      width: 100%;
      max-width: 1120px;
      margin: 24px auto 0;
      background: rgba(255,77,109,0.12);
      border: 1px solid rgba(255,77,109,0.3);
      color: var(--danger);
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes question-in { from { opacity: .35; transform: translateX(8px); } to { opacity: 1; transform: none; } }
    @keyframes timer-pulse { 50% { box-shadow: 0 0 0 5px rgba(255,77,109,.1); } }

    @media (max-width: 900px) {
      .exam-body { grid-template-columns: 1fr; }
    }

    @media (max-width: 700px) {
      .q-nav-btn { width: 36px; height: 36px; }
      .exam-header { padding: 14px 16px; }
      .exam-body { padding: 20px 16px 32px; }
      .question-area { padding: 22px; }
      .exam-nav { flex-direction: column; }
      .exam-nav .btn { width: 100%; }
      .last-question-hint { width: 100%; padding: 0; order: 0; }
      .exam-title { max-width: calc(100% - 58px); }
      .timer-display { order: 3; flex: 1; justify-content: center; }
    }


    /* ─── RICH TEXT / CODE PRESENTATION ─── */
    .q-text .code-block,
    .review-q-text .code-block {
      display: block;
      margin: 16px 0;
      padding: 16px 18px;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #101016;
      color: #f3f3f7;
      font-family: 'DM Mono', monospace;
      font-size: .88rem;
      line-height: 1.65;
      text-align: left;
      white-space: pre;
      tab-size: 2;
      -webkit-overflow-scrolling: touch;
    }

    .q-text .code-block code,
    .review-q-text .code-block code {
      font-family: inherit;
      color: inherit;
      white-space: inherit;
    }

    .q-text .inline-code,
    .review-q-text .inline-code,
    .explanation-text .inline-code {
      display: inline;
      padding: .12em .38em;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--surface2);
      color: var(--accent);
      font-family: 'DM Mono', monospace;
      font-size: .92em;
      overflow-wrap: anywhere;
    }

    html[data-theme="light"] .q-text .code-block,
    html[data-theme="light"] .review-q-text .code-block {
      background: #1e2028;
      border-color: #323541;
      color: #f6f7fb;
      box-shadow: 0 10px 26px rgba(27, 28, 35, .10);
    }

    html[data-theme="light"] .q-text .inline-code,
    html[data-theme="light"] .review-q-text .inline-code,
    html[data-theme="light"] .explanation-text .inline-code {
      background: #eeeae3;
      border-color: #d2cdc2;
      color: #4c42bd;
    }

    /* ─── EXAM LIGHT-MODE CONTROL HIERARCHY ─── */
    html[data-theme="light"] .exam-header {
      background: rgba(255, 253, 249, .94);
      border-bottom-color: #d7d3ca;
      box-shadow: 0 8px 24px rgba(33, 31, 25, .07);
    }

    html[data-theme="light"] .exam-title-text span {
      color: #6c707e;
    }

    html[data-theme="light"] .exam-title-text strong {
      color: #1b1b24;
    }

    html[data-theme="light"] .sound-toggle,
    html[data-theme="light"] .theme-toggle {
      background: #fffdf9;
      border-color: #cbc6bc;
      color: #3e414c;
      box-shadow: 0 4px 12px rgba(33, 31, 25, .07);
    }

    html[data-theme="light"] .sound-toggle:hover,
    html[data-theme="light"] .theme-toggle:hover {
      background: #ffffff;
      border-color: #5548d9;
      color: #4c42bd;
      box-shadow: 0 6px 16px rgba(85, 72, 217, .12);
    }

    html[data-theme="light"] .submit-exam-btn {
      background: linear-gradient(135deg, #5548d9, #6c5ee8);
      border: 1px solid #5548d9;
      color: #fff;
      box-shadow: 0 8px 22px rgba(85, 72, 217, .22);
    }

    html[data-theme="light"] .submit-exam-btn:hover {
      background: linear-gradient(135deg, #493dca, #5d50d8);
      box-shadow: 0 10px 26px rgba(85, 72, 217, .27);
    }

    html[data-theme="light"] #prev-question-btn {
      background: #fffdf9;
      border-color: #c9c5bb;
      color: #3f424d;
      box-shadow: 0 3px 10px rgba(33, 31, 25, .05);
    }

    html[data-theme="light"] #prev-question-btn:hover:not(:disabled) {
      background: #f7f5f0;
      border-color: #5548d9;
      color: #4c42bd;
    }

    html[data-theme="light"] #next-question-btn {
      background: #5548d9;
      border-color: #5548d9;
      color: #fff;
      box-shadow: 0 5px 16px rgba(85, 72, 217, .18);
    }

    html[data-theme="light"] #next-question-btn:hover:not(:disabled) {
      background: #493dca;
      border-color: #493dca;
      color: #fff;
      box-shadow: 0 7px 20px rgba(85, 72, 217, .22);
    }

    /* ─── MOCKIFY THEME TOGGLE + LIGHT THEME ─── */
    .theme-toggle {
      width: 38px;
      height: 38px;
      min-width: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--surface2);
      color: var(--text);
      cursor: pointer;
      line-height: 1;
      position: relative;
      isolation: isolate;
      transition: transform .18s ease, border-color .18s ease, background .18s ease, color .18s ease, box-shadow .18s ease;
    }
    .theme-toggle:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
      color: var(--accent);
    }
    .theme-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .theme-toggle .theme-icon {
      width: 17px;
      height: 17px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .theme-toggle .icon-sun { display: none; }
    .theme-toggle .icon-moon { display: block; }

    html[data-theme="light"] {
      color-scheme: light;
      --bg: #f5f3ee;
      --surface: #fffdf9;
      --surface2: #eeece6;
      --border: #d7d3ca;
      --accent: #5548d9;
      --accent2: #c25f78;
      --accent3: #188653;
      --text: #1b1b24;
      --text-dim: #5f6270;
      --text-faint: #7d808d;
      --danger: #c83b55;
      --warn: #9b6700;
      --success: #188653;
      --shadow: 0 12px 34px rgba(33, 31, 25, 0.08);
      --glow: 0 0 44px rgba(85, 72, 217, 0.08);
    }

    html[data-theme="light"] body {
      background: var(--bg);
      color: var(--text);
    }

    html[data-theme="light"] body::before {
      background-image:
        linear-gradient(rgba(85,72,217,0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(85,72,217,0.055) 1px, transparent 1px);
    }

    html[data-theme="light"] .hero-glow {
      background: radial-gradient(ellipse at center, rgba(85,72,217,0.13) 0%, rgba(194,95,120,0.055) 42%, transparent 72%);
    }

    html[data-theme="light"] .btn-primary {
      background: #5548d9;
      color: #fff;
      box-shadow: 0 8px 24px rgba(85,72,217,0.22);
    }
    html[data-theme="light"] .btn-primary:hover {
      background: #493dca;
      box-shadow: 0 10px 28px rgba(85,72,217,0.27);
    }
    html[data-theme="light"] .btn-secondary {
      background: rgba(255,253,249,0.72);
      border-color: var(--border);
      color: var(--text);
      box-shadow: 0 2px 10px rgba(33,31,25,0.03);
    }
    html[data-theme="light"] .btn-secondary:hover {
      background: #fffdf9;
      border-color: rgba(85,72,217,0.45);
      color: var(--accent);
    }

    html[data-theme="light"] .site-nav.scrolled {
      background: rgba(255,253,249,0.86);
      border-bottom-color: rgba(215,211,202,0.9);
      box-shadow: 0 6px 24px rgba(33,31,25,0.04);
    }
    html[data-theme="light"] .site-nav-links a:hover {
      color: var(--text);
      background: rgba(85,72,217,0.06);
    }
    html[data-theme="light"] .mobile-nav {
      background: rgba(245,243,238,0.98);
    }
    html[data-theme="light"] .mobile-nav-links a {
      border-bottom-color: var(--border);
    }

    html[data-theme="light"] .navbar {
      background: rgba(255,253,249,0.9);
      border-bottom-color: rgba(215,211,202,0.9);
      box-shadow: 0 6px 24px rgba(33,31,25,0.045);
    }
    html[data-theme="light"] .nav-pill {
      background: rgba(85,72,217,0.08);
      border-color: rgba(85,72,217,0.2);
      color: var(--accent);
    }
    html[data-theme="light"] .theme-toggle {
      background: #fffdf9;
      box-shadow: 0 3px 12px rgba(33,31,25,0.06);
    }
    html[data-theme="light"] .theme-toggle .icon-sun { display: block; }
    html[data-theme="light"] .theme-toggle .icon-moon { display: none; }

    html[data-theme="light"] .auth-card,
    html[data-theme="light"] .generate-card,
    html[data-theme="light"] .feedback-card,
    html[data-theme="light"] .stat-box,
    html[data-theme="light"] .table-wrap,
    html[data-theme="light"] .score-hero,
    html[data-theme="light"] .review-card,
    html[data-theme="light"] .nav-panel,
    html[data-theme="light"] .question-area {
      background: var(--surface);
      border-color: var(--border);
      box-shadow: var(--shadow);
    }

    html[data-theme="light"] .tab-switcher,
    html[data-theme="light"] .form-group input,
    html[data-theme="light"] .topic-input,
    html[data-theme="light"] .duration-select,
    html[data-theme="light"] .feedback-select,
    html[data-theme="light"] .feedback-textarea,
    html[data-theme="light"] .q-nav-btn,
    html[data-theme="light"] .option-key,
    html[data-theme="light"] .review-q-num,
    html[data-theme="light"] .admin-tabs,
    html[data-theme="light"] .limit-input {
      background: #eeece6;
      border-color: #d2cec4;
      color: var(--text);
    }
    html[data-theme="light"] .form-group input:focus,
    html[data-theme="light"] .topic-input:focus,
    html[data-theme="light"] .feedback-select:focus,
    html[data-theme="light"] .feedback-textarea:focus,
    html[data-theme="light"] .limit-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(85,72,217,0.12);
    }

    html[data-theme="light"] .option-btn {
      background: #eeece6;
      border-color: #d2cec4;
      color: var(--text);
    }
    html[data-theme="light"] .option-btn:hover:not(.selected) {
      border-color: rgba(85,72,217,0.42);
      background: #f3f1ec;
    }
    html[data-theme="light"] .option-btn.selected {
      background: rgba(85,72,217,0.09);
      border-color: var(--accent);
    }
    html[data-theme="light"] .q-nav-btn.answered {
      background: rgba(85,72,217,0.08);
    }
    html[data-theme="light"] .q-nav-btn.current {
      background: var(--accent);
      color: #fff;
    }

    html[data-theme="light"] .score-hero::before {
      background: radial-gradient(circle at 50% 0%, rgba(85,72,217,0.08) 0%, transparent 60%);
    }
    html[data-theme="light"] .review-opt {
      background: #eeece6;
      border-color: #d2cec4;
      color: var(--text);
    }
    html[data-theme="light"] .review-opt.is-correct {
      background: rgba(24,134,83,0.07);
      border-color: rgba(24,134,83,0.28);
    }
    html[data-theme="light"] .review-opt.is-wrong {
      background: rgba(200,59,85,0.07);
      border-color: rgba(200,59,85,0.28);
    }
    html[data-theme="light"] .explanation-box {
      background: rgba(85,72,217,0.055);
      border-color: rgba(85,72,217,0.2);
    }
    html[data-theme="light"] .toast,
    html[data-theme="light"] .modal-box {
      background: var(--surface);
      border-color: var(--border);
      box-shadow: 0 16px 40px rgba(33,31,25,0.14);
    }
    html[data-theme="light"] .modal-overlay {
      background: rgba(35,34,30,0.32);
    }
    html[data-theme="light"] .loading-overlay {
      background: rgba(245,243,238,0.92);
    }

    html[data-theme="light"] th {
      background: #eeece6;
    }
    html[data-theme="light"] td {
      border-bottom-color: rgba(215,211,202,0.75);
    }
    html[data-theme="light"] tr:hover td {
      background: rgba(85,72,217,0.035);
    }

    @media (max-width: 700px) {
      .theme-toggle {
        width: 34px;
        height: 34px;
        min-width: 34px;
      }
      .theme-toggle .theme-icon {
        width: 16px;
        height: 16px;
      }
    }

  </style>
</head>
<body>
  <div class="loading-overlay" id="loading-overlay">
    <div class="loading-icon"></div>
    <div class="loading-text">Preparing your exam...</div>
    <div class="loading-sub" id="loading-sub">Loading questions</div>
  </div>

  <div class="modal-overlay" id="modal-overlay" role="presentation">
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-body">
      <div class="modal-title" id="modal-title" tabindex="-1">Are you sure?</div>
      <div class="modal-body" id="modal-body">This action cannot be undone.</div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="modal-cancel-btn" onclick="closeModal()">Continue test</button>
        <button type="button" class="btn btn-secondary" id="modal-confirm-btn">Confirm</button>
      </div>
    </div>
  </div>

  <div id="error-box" class="error-box"></div>

  <div class="page">
    <div class="exam-header">
      <div class="exam-title">
        <span class="logo-mark" aria-hidden="true">
          <svg width="26" height="26" viewBox="0 0 32 32" fill="none">
            <rect width="32" height="32" rx="9" fill="url(#eg1)"/>
            <path d="M9 20V12L16 17L23 12V20" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
            <defs><linearGradient id="eg1" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#6c63ff"/><stop offset="1" stop-color="#ff6584"/></linearGradient></defs>
          </svg>
        </span>
        <div class="exam-title-text">
          <span>Mockify Exam</span>
          <strong id="exam-topic">Loading...</strong>
        </div>
      </div>
      <button class="sound-toggle" id="sound-toggle" type="button" aria-pressed="false" aria-label="Enable final ten-second timer sound" title="Timer sound is off"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m16 10 4 4m0-4-4 4"/></svg></button>
      <button type="button" class="theme-toggle" onclick="toggleMockifyTheme()" aria-label="Switch to light mode" title="Switch to light mode" aria-pressed="false">
  <svg class="theme-icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.6A8.6 8.6 0 0 1 8.4 3.8 8.6 8.6 0 1 0 20.2 15.6Z"/></svg>
  <svg class="theme-icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>
</button>
      <div class="timer-display" id="timer-display" aria-live="polite">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7"/><path d="M12 9v4l3 2M9 3h6"/></svg>
        <span id="timer-text">--:--</span>
        <span class="timer-state" id="timer-state"></span>
      </div>
      <button type="button" class="submit-exam-btn" onclick="confirmSubmit(event)">Submit Exam</button>
    </div>

    <div class="exam-body">
      <div class="nav-panel">
        <div class="nav-label">Questions</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px" id="q-nav-grid"></div>
        <div style="margin-top:18px">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
            <div style="width:12px;height:12px;border-radius:2px;background:var(--accent)"></div>
            <span style="font-size:0.75rem;color:var(--text-dim)">Answered</span>
          </div>
          <div style="display:flex;align-items:center;gap:6px">
            <div style="width:12px;height:12px;border-radius:2px;border:2px solid var(--border)"></div>
            <span style="font-size:0.75rem;color:var(--text-dim)">Unanswered</span>
          </div>
        </div>
      </div>

      <div class="question-area">
        <div class="q-counter" id="q-counter">Question 1 of 10</div>
        <div class="exam-progress" aria-hidden="true"><span id="exam-progress-fill"></span></div>
        <div class="q-text" id="q-text">Loading question...</div>
        <div class="options-grid" id="options-grid"></div>
        <div class="exam-nav">
          <button type="button" class="btn btn-secondary" id="prev-question-btn" onclick="prevQuestion()">← Previous</button>
          <div class="last-question-hint" id="last-question-hint" aria-live="polite">If you have finished, you can simply submit the test.</div>
          <button type="button" class="btn btn-secondary" id="next-question-btn" onclick="nextQuestion()">Next →</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = '/api';
    let examQuestions = [];
    let examAnswers = {};
    let examMockId = null;
    let examTopic = '';
    let currentQuestion = 0;
    let timerInterval = null;
    let timerSeconds = 0;
    let timerEnabled = true;
    let examStartTime = null;
    let examSubmitInFlight = false;
    let navigatingToResult = false;
    let soundEnabled = false;
    let audioContext = null;
    let lastModalTrigger = null;

    function escapeHtml(s) {
      if (s == null) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function renderRichText(value) {
      const source = String(value == null ? '' : value)
        .replace(/\r\n/g, '\n')
        .replace(/\r/g, '\n');

      const chunks = source.split(/(```[^\n]*\n[\s\S]*?```)/g);

      return chunks.map(chunk => {
        const fenced = chunk.match(/^```([^\n]*)\n([\s\S]*?)```$/);

        if (fenced) {
          const language = escapeHtml(fenced[1].trim());
          const code = fenced[2].replace(/\n$/, '');

          return `
            <pre class="code-block"${language ? ` data-language="${language}"` : ''}><code>${escapeHtml(code)}</code></pre>
          `;
        }

        let html = escapeHtml(chunk);

        html = html.replace(
          /`([^`\n]+)`/g,
          '<code class="inline-code">$1</code>'
        );

        return html.replace(/\n/g, '<br>');
      }).join('');
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function showLoading(msg = 'Preparing your exam...', sub = 'Loading questions') {
      document.getElementById('loading-overlay').classList.add('active');
      document.querySelector('.loading-text').textContent = msg;
      document.getElementById('loading-sub').textContent = sub;
    }

    function hideLoading() {
      document.getElementById('loading-overlay').classList.remove('active');
    }

    function showError(message) {
      const el = document.getElementById('error-box');
      el.textContent = message;
      el.style.display = 'block';
    }

    function openModal(title, body, onConfirm) {
      lastModalTrigger = document.activeElement;
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').textContent = body;
      document.getElementById('modal-confirm-btn').onclick = () => { closeModal(); onConfirm(); };
      document.getElementById('modal-overlay').classList.add('active');
      requestAnimationFrame(() => document.getElementById('modal-title').focus());
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('active');
      if (lastModalTrigger && document.contains(lastModalTrigger)) lastModalTrigger.focus();
    }

    function updateSoundToggle() {
      const button = document.getElementById('sound-toggle');
      button.innerHTML = soundEnabled
        ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15 10a3 3 0 0 1 0 4M17.5 7.5a6.5 6.5 0 0 1 0 9"/></svg>'
        : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m16 10 4 4m0-4-4 4"/></svg>';
      button.setAttribute('aria-pressed', String(soundEnabled));
      button.setAttribute('aria-label', soundEnabled ? 'Disable final ten-second timer sound' : 'Enable final ten-second timer sound');
      button.title = soundEnabled ? 'Timer sound is on' : 'Timer sound is off';
    }

    async function toggleSound() {
      soundEnabled = !soundEnabled;
      localStorage.setItem('mockify-sound-enabled', String(soundEnabled));
      updateSoundToggle();
      if (soundEnabled) {
        try {
          audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
          await audioContext.resume();
        } catch (e) { soundEnabled = false; updateSoundToggle(); }
      }
    }

    function playTimerTick() {
      if (!soundEnabled || !audioContext || audioContext.state !== 'running') return;
      try {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        oscillator.frequency.value = 760;
        gain.gain.setValueAtTime(.025, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(.001, audioContext.currentTime + .06);
        oscillator.connect(gain).connect(audioContext.destination);
        oscillator.start(); oscillator.stop(audioContext.currentTime + .065);
      } catch (e) { /* Visual timer feedback remains available. */ }
    }

    async function apiCall(method, path, body) {
      const opts = {
        method,
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include'
      };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(API + path, opts);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    function submittedResultStorageKey(mockId) {
      return `mockify_submitted_mock_${mockId}`;
    }

    function getSubmittedResultId(mockId) {
      if (mockId == null) return null;
      return sessionStorage.getItem(submittedResultStorageKey(mockId));
    }

    function markMockSubmitted(mockId, resultId) {
      if (mockId == null || resultId == null) return;
      sessionStorage.setItem(
        submittedResultStorageKey(mockId),
        String(resultId)
      );
    }

    function openResultPage(resultId, resultData = null) {
      if (resultData) {
        sessionStorage.setItem('mockify_latest_result', JSON.stringify(resultData));
      }

      // Permanently mark this mock as submitted in this browser session
      // before leaving the exam page. This protects against mobile browser
      // back/forward-cache restoring the old exam document.
      markMockSubmitted(examMockId, resultId);

      // Keep the full-screen loading state visible until result.html paints.
      navigatingToResult = true;
      window.location.replace(
        resultId ? `result.html?result_id=${resultId}` : 'result.html'
      );
    }

    function loadExam(data) {
      examQuestions = data.questions || [];
      examMockId = data.mock_id;
      examTopic = data.topic || 'Mock Test';
      document.getElementById('exam-topic').textContent = examTopic;
      buildNavGrid();
      renderQuestion(0);

      const timerMinutes = Number(data.timer_minutes);
      if (Number.isFinite(timerMinutes) && timerMinutes > 0) {
        timerEnabled = true;
        timerSeconds = timerMinutes * 60;
      } else {
        timerEnabled = false;
        timerSeconds = 0;
      }

      examStartTime = Date.now();
      startTimer();
    }

    function buildNavGrid() {
      const grid = document.getElementById('q-nav-grid');
      grid.innerHTML = examQuestions.map((_, i) => `
        <button type="button" class="q-nav-btn ${i === 0 ? 'current' : ''}" id="qnav-${i}" onclick="goToQuestion(${i})">${i + 1}</button>
      `).join('');
    }

    function renderQuestion(idx) {
      const q = examQuestions[idx];
      if (!q) return;
      document.getElementById('q-counter').textContent = `Question ${idx + 1} of ${examQuestions.length}`;
      document.getElementById('exam-progress-fill').style.width = `${((idx + 1) / examQuestions.length) * 100}%`;
      document.getElementById('q-text').innerHTML = renderRichText(q.question);

      const grid = document.getElementById('options-grid');
      grid.innerHTML = ['A', 'B', 'C', 'D'].map(key => {
        const selected = examAnswers[idx] === key;
        return `<button type="button" class="option-btn ${selected ? 'selected' : ''}" onclick="selectAnswer(${idx}, '${key}')">
          <span class="option-key">${key}</span>
          <span>${renderRichText(q.options[key])}</span>
        </button>`;
      }).join('');

      document.querySelectorAll('.q-nav-btn').forEach((b, i) => {
        b.classList.remove('current', 'answered');
        if (i === idx) b.classList.add('current');
        else if (examAnswers[i]) b.classList.add('answered');
      });

      currentQuestion = idx;

      const isLastQuestion = idx === examQuestions.length - 1;
      const nextButton = document.getElementById('next-question-btn');
      const lastQuestionHint = document.getElementById('last-question-hint');
      if (nextButton) {
        nextButton.style.display = isLastQuestion ? 'none' : '';
      }
      if (lastQuestionHint) {
        lastQuestionHint.classList.toggle('visible', isLastQuestion);
      }

      const area = document.querySelector('.question-area');
      area.classList.remove('is-changing');
      requestAnimationFrame(() => area.classList.add('is-changing'));
    }

    function selectAnswer(qIdx, key) {
      examAnswers[qIdx] = key;
      renderQuestion(qIdx);
    }

    function goToQuestion(idx) { renderQuestion(idx); }
    function nextQuestion() { if (currentQuestion < examQuestions.length - 1) renderQuestion(currentQuestion + 1); }
    function prevQuestion() { if (currentQuestion > 0) renderQuestion(currentQuestion - 1); }

    function updateTimerDisplay() {
      const el = document.getElementById('timer-display');
      const text = document.getElementById('timer-text');

      el.classList.remove('warning', 'danger');

      if (!timerEnabled) {
        text.textContent = 'No limit';
        document.getElementById('timer-state').textContent = '';
        return;
      }

      text.textContent = formatTime(timerSeconds);
      const state = document.getElementById('timer-state');
      if (timerSeconds <= 10) { el.classList.add('danger'); state.textContent = 'FINAL'; }
      else if (timerSeconds <= 60) { el.classList.add('warning'); state.textContent = '1 MIN'; }
      else state.textContent = '';
    }

    function startTimer() {
      clearInterval(timerInterval);
      updateTimerDisplay();

      if (!timerEnabled) return;

      timerInterval = setInterval(() => {
        timerSeconds--;
        updateTimerDisplay();

        if (timerSeconds > 0 && timerSeconds <= 10) playTimerTick();

        if (timerSeconds <= 0) {
          clearInterval(timerInterval);
          submitExam();
        }
      }, 1000);
    }

    function confirmSubmit(event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      const answered = Object.keys(examAnswers).length;
      const unanswered = examQuestions.length - answered;
      if (unanswered > 0) {
        openModal('Submit Exam?', `You have ${unanswered} unanswered question(s). Are you sure you want to submit?`, submitExam);
      } else {
        submitExam();
      }
    }

    async function submitExam() {
      if (examSubmitInFlight) return;
      examSubmitInFlight = true;
      clearInterval(timerInterval);
      showLoading('Evaluating answers...', 'Calculating your score');

      try {
        const data = await apiCall('POST', '/results/submit', {
          mock_id: examMockId,
          answers: examAnswers,
          time_taken: Math.round((Date.now() - examStartTime) / 1000)
        });
        openResultPage(data.result_id, data);
      } catch (e) {
        showError("We couldn't submit your test right now. Your answers are still on screen—check your connection and try again.");
      } finally {
        examSubmitInFlight = false;
        if (!navigatingToResult) {
          hideLoading();
        }
      }
    }

    async function init() {
      showLoading();
      const params = new URLSearchParams(window.location.search);
      const mockId = params.get('mock_id');

      // If this mock has already been submitted, never recreate the exam.
      // This is especially important when a mobile browser restores an old
      // exam document from its back/forward cache.
      const submittedResultId = getSubmittedResultId(mockId);
      if (submittedResultId) {
        navigatingToResult = true;
        window.location.replace(
          `result.html?result_id=${encodeURIComponent(submittedResultId)}`
        );
        return;
      }

      const stored = sessionStorage.getItem('mockify_latest_exam');

      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          if (!mockId || String(parsed.mock_id) === String(mockId)) {
            loadExam(parsed);
            sessionStorage.removeItem('mockify_latest_exam');
            hideLoading();
            return;
          }
        } catch (e) {}
      }

      if (!mockId) {
        hideLoading();
        showError('No mock selected. Go back to the dashboard and generate a mock first.');
        return;
      }

      try {
        const data = await apiCall('GET', `/mock/${mockId}`);
        loadExam(data);
      } catch (e) {
        showError(e.message);
      } finally {
        hideLoading();
      }
    }

    document.getElementById('sound-toggle').addEventListener('click', toggleSound);
    document.addEventListener('keydown', (event) => {
      const modal = document.getElementById('modal-overlay');
      if (event.key === 'Tab' && modal.classList.contains('active')) {
        const focusable = [...modal.querySelectorAll('button:not([disabled]), [href], input:not([disabled])')];
        const first = focusable[0], last = focusable[focusable.length - 1];
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
        return;
      }
      if (event.key === 'Escape' && document.getElementById('modal-overlay').classList.contains('active')) return closeModal();
      if (event.target.matches('input, textarea, select, button')) return;
      const choice = { '1': 'A', '2': 'B', '3': 'C', '4': 'D', a: 'A', b: 'B', c: 'C', d: 'D' }[event.key.toLowerCase()];
      if (choice && examQuestions.length) selectAnswer(currentQuestion, choice);
      if (event.key === 'ArrowRight') nextQuestion();
      if (event.key === 'ArrowLeft') prevQuestion();
    });
    window.addEventListener('pagehide', () => { clearInterval(timerInterval); if (audioContext) audioContext.close().catch(() => {}); }, { once: true });

    // Mobile Chrome/Safari may restore exam.html from the back/forward cache
    // without running init() again. Re-check the submitted marker whenever
    // that happens so a completed exam can never be restarted by Back.
    window.addEventListener('pageshow', (event) => {
      if (!event.persisted) return;

      const params = new URLSearchParams(window.location.search);
      const mockId = params.get('mock_id');
      const submittedResultId = getSubmittedResultId(mockId);

      if (submittedResultId) {
        navigatingToResult = true;
        window.location.replace(
          `result.html?result_id=${encodeURIComponent(submittedResultId)}`
        );
      }
    });

    soundEnabled = localStorage.getItem('mockify-sound-enabled') === 'true';
    updateSoundToggle();
    init();
  </script>

<script>
(function () {
  function getTheme() {
    return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  }

  function updateThemeUI() {
    const light = getTheme() === 'light';
    document.querySelectorAll('.theme-toggle').forEach(function (button) {
      button.setAttribute('aria-pressed', String(light));
      button.setAttribute('aria-label', light ? 'Switch to dark mode' : 'Switch to light mode');
      button.setAttribute('title', light ? 'Switch to dark mode' : 'Switch to light mode');
    });
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', light ? '#f5f3ee' : '#0a0a0f');
  }

  window.toggleMockifyTheme = function () {
    const next = getTheme() === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('mockify-theme', next); } catch (e) {}
    updateThemeUI();
  };

  window.updateMockifyThemeUI = updateThemeUI;
  updateThemeUI();
})();
</script>

</body>
</html>
