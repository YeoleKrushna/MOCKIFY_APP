<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<script>
(function () {
  try {
    const saved = localStorage.getItem('mockify-theme');
    document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
})();
</script>
  <meta name="theme-color" content="#0a0a0f">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <link rel="canonical" href="https://mockify.tech/result.html">
  <title>Mockify Result | Private Practice Review</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="apple-touch-icon" href="/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c27;
      --border: #2a2a3d;
      --accent: #6c63ff;
      --accent2: #ff6584;
      --accent3: #43e97b;
      --text: #e8e8f0;
      --text-dim: #8888aa;
      --danger: #ff4d6d;
      --warn: #ffd166;
      --success: #43e97b;
      --radius: 14px;
      --radius-sm: 8px;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
      --glow: 0 0 40px rgba(108,99,255,0.15);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(108,99,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(108,99,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none; z-index: 0;
    }

    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

    .page { min-height: 100vh; position: relative; z-index: 1; display: flex; flex-direction: column; }

    .navbar {
      display: flex; align-items: center; gap: 10px;
      background: rgba(19,19,26,0.9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      position: sticky; top: 0; z-index: 50;
    }

    .nav-logo {
      display: inline-flex; align-items: center; gap: 9px;
      font-family: 'DM Serif Display', serif;
      font-size: 1.4rem;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.02em;
    }

    .nav-spacer { flex: 1; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 13px 24px;
      border: none; border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
      text-decoration: none;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 20px rgba(108,99,255,0.35);
    }

    .btn-primary:hover { background: #7c75ff; transform: translateY(-1px); box-shadow: 0 6px 28px rgba(108,99,255,0.45); }

    .btn-secondary {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

    .result-body {
      flex: 1; padding: 32px 24px;
      max-width: 800px; width: 100%; margin: 0 auto;
    }

    .score-hero {
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px 32px;
      margin-bottom: 28px;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .score-hero.is-ready { animation: result-arrive .45s ease both; }

    .score-hero::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 0%, rgba(108,99,255,0.12) 0%, transparent 60%);
    }

    .score-grade {
      position: relative;
      font-family: 'DM Mono', monospace;
      font-size: 5rem; font-weight: 500;
      line-height: 1;
      margin-bottom: 4px;
    }

    .score-grade.excellent { color: var(--success); }
    .score-grade.good { color: var(--accent); }
    .score-grade.average { color: var(--warn); }
    .score-grade.poor { color: var(--danger); }

    .score-label {
      position: relative;
      color: var(--text-dim);
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .result-topic-label {
      position: relative;
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-top: 4px;
    }

    .score-stats {
      position: relative;
      display: flex; justify-content: center; gap: 32px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .score-stat { text-align: center; }
    .score-stat-val { font-family: 'DM Mono', monospace; font-size: 1.8rem; font-weight: 500; line-height: 1; }
    .score-stat-lbl { font-size: 0.75rem; color: var(--text-dim); margin-top: 4px; }

    .section-title {
      font-family: 'DM Serif Display', serif;
      font-size: 1.3rem;
      margin-bottom: 16px;
    }

    .questions-review { display: flex; flex-direction: column; gap: 12px; }

    .review-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .review-card { animation: review-in .32s ease both; }
    .review-card:nth-child(2) { animation-delay: .04s; }.review-card:nth-child(3) { animation-delay: .08s; }.review-card:nth-child(4) { animation-delay: .12s; }

    .review-card.correct { border-left: 3px solid var(--success); }
    .review-card.incorrect { border-left: 3px solid var(--danger); }
    .review-card.unanswered { border-left: 3px solid var(--text-dim); }

    .review-q-head {
      display: flex; align-items: flex-start; gap: 12px;
      margin-bottom: 14px;
    }

    .review-q-num {
      background: var(--surface2);
      width: 28px; height: 28px; min-width: 28px;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-family: 'DM Mono', monospace; font-size: 0.8rem;
      color: var(--text-dim);
    }

    .review-q-text {
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text);
      flex: 1;
    }

    .review-options { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

    .review-opt {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 0.85rem;
      display: flex; align-items: center; gap: 8px;
      min-width: 0;
    }

    .review-opt.is-correct { border-color: rgba(67,233,123,0.4); background: rgba(67,233,123,0.07); color: var(--success); }
    .review-opt.is-wrong { border-color: rgba(255,77,109,0.4); background: rgba(255,77,109,0.07); color: var(--danger); }

    .review-opt-key {
      width: 22px; height: 22px; min-width: 22px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.04);
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
    }

    .result-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 24px;
    }

    .error-box {
      background: rgba(255,77,109,0.12);
      border: 1px solid rgba(255,77,109,0.3);
      color: var(--danger);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      margin-bottom: 16px;
      display: none;
    }

    .explanation-box {
      margin-top: 16px;
      padding: 16px 18px;
      background: rgba(108,99,255,0.07);
      border: 1px solid rgba(108,99,255,0.28);
      border-radius: var(--radius-sm);
    }

    .explanation-title {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .explanation-text {
      color: var(--text);
      font-size: 0.88rem;
      line-height: 1.65;
    }

    .your-answer-line {
      margin-top: 10px;
      font-size: 0.82rem;
      color: var(--text-dim);
    }

    .result-utility { display:flex; justify-content:center; margin-top:16px; }
    .toast { position: fixed; right: 20px; bottom: 20px; z-index: 90; max-width: min(360px, calc(100vw - 32px)); padding: 12px 16px; background: var(--surface2); border:1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow); color:var(--text); opacity:0; transform:translateY(8px); transition: opacity .2s, transform .2s; }
    .toast.show { opacity:1; transform:none; }
    @keyframes result-arrive { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
    @keyframes review-in { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }

    @media (max-width: 700px) {
      .score-grade { font-size: 3.4rem; }
      .score-stats { gap: 18px; }
    }

    @media (max-width: 500px) {
      .review-options { grid-template-columns: 1fr; }
      .result-actions { flex-direction: column; }
      .result-body { padding: 24px 16px 32px; }
      .navbar { padding: 14px 16px; }
    }


    /* ─── RESULT LIGHT-MODE VISUAL HIERARCHY ─── */
    html[data-theme="light"] .result-body {
      color: var(--text);
    }

    html[data-theme="light"] .score-hero {
      background: linear-gradient(180deg, #fffefa 0%, #fbf8f2 100%);
      border-color: #d5d0c5;
      box-shadow:
        0 18px 42px rgba(33, 31, 25, .09),
        0 2px 6px rgba(33, 31, 25, .04);
    }

    html[data-theme="light"] .score-hero::after {
      content: '';
      position: absolute;
      left: 18%;
      right: 18%;
      bottom: 0;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(85,72,217,.26),
        transparent
      );
    }

    html[data-theme="light"] .score-stats {
      margin-top: 30px;
      gap: 10px;
    }

    html[data-theme="light"] .score-stat {
      min-width: 104px;
      padding: 14px 12px;
      border: 1px solid #d8d3ca;
      border-radius: 12px;
      background: rgba(246, 243, 237, .82);
      box-shadow: 0 3px 10px rgba(33, 31, 25, .035);
    }

    html[data-theme="light"] .score-stat-lbl {
      color: #6a6d79;
    }

    html[data-theme="light"] .section-title {
      margin-top: 34px;
      margin-bottom: 18px;
      color: #191a22;
      letter-spacing: -.01em;
    }

    html[data-theme="light"] .review-card {
      background: #fffdf9;
      border-color: #d5d0c7;
      box-shadow:
        0 10px 26px rgba(33, 31, 25, .06),
        0 1px 3px rgba(33, 31, 25, .04);
    }

    html[data-theme="light"] .review-card.correct {
      border-left-color: #188653;
      background: linear-gradient(180deg, #fffdf9 0%, #fbfdf9 100%);
    }

    html[data-theme="light"] .review-card.incorrect {
      border-left-color: #c83b55;
      background: linear-gradient(180deg, #fffdf9 0%, #fffafa 100%);
    }

    html[data-theme="light"] .review-card.unanswered {
      border-left-color: #878b97;
    }

    html[data-theme="light"] .review-q-num {
      background: #efebe4;
      border: 1px solid #d6d1c7;
      color: #4d5060;
    }

    html[data-theme="light"] .review-q-text {
      color: #20212a;
    }

    html[data-theme="light"] .review-options {
      gap: 8px;
    }

    html[data-theme="light"] .review-opt {
      background: #f5f2ec;
      border-color: #d8d3c9;
      color: #2e3039;
      box-shadow: 0 1px 3px rgba(33, 31, 25, .025);
    }

    html[data-theme="light"] .review-opt.is-correct {
      background: #edf8f1;
      border-color: rgba(24,134,83,.34);
      color: #126b43;
    }

    html[data-theme="light"] .review-opt.is-wrong {
      background: #fff0f2;
      border-color: rgba(200,59,85,.30);
      color: #a52e47;
    }

    html[data-theme="light"] .review-opt-key {
      background: #e9e5de;
      color: #575a67;
    }

    html[data-theme="light"] .review-opt.is-correct .review-opt-key {
      background: #d7f0e1;
      color: #126b43;
    }

    html[data-theme="light"] .review-opt.is-wrong .review-opt-key {
      background: #f9dce2;
      color: #a52e47;
    }

    html[data-theme="light"] .explanation-box {
      background: #f2effa;
      border-color: rgba(85,72,217,.19);
      box-shadow: 0 4px 14px rgba(85,72,217,.045);
    }

    html[data-theme="light"] .explanation-title {
      color: #4c42bd;
    }

    html[data-theme="light"] .explanation-text {
      color: #292b35;
    }

    html[data-theme="light"] .your-answer-line {
      color: #6b6e7b;
    }

    html[data-theme="light"] .result-actions .btn-secondary {
      background: #fffdf9;
      border-color: #c9c5bb;
      color: #3f424d;
    }

    html[data-theme="light"] .result-actions .btn-primary {
      background: linear-gradient(135deg, #5548d9, #6c5ee8);
      border-color: #5548d9;
      box-shadow: 0 8px 20px rgba(85,72,217,.20);
    }

    html[data-theme="light"] .result-actions .btn-primary:hover {
      background: linear-gradient(135deg, #493dca, #5d50d8);
    }

    /* Result-page rich/code rendering */
    .review-q-text .code-block,
    .explanation-text .code-block {
      display: block;
      margin: 14px 0;
      padding: 14px 16px;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #101016;
      color: #f3f3f7;
      font-family: 'DM Mono', monospace;
      font-size: .84rem;
      line-height: 1.6;
      white-space: pre;
      tab-size: 2;
      -webkit-overflow-scrolling: touch;
    }

    .review-q-text .code-block code,
    .explanation-text .code-block code {
      font-family: inherit;
      white-space: inherit;
    }

    .review-q-text .inline-code,
    .explanation-text .inline-code {
      padding: .1em .35em;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface2);
      color: var(--accent);
      font-family: 'DM Mono', monospace;
      font-size: .92em;
    }

    html[data-theme="light"] .review-q-text .code-block,
    html[data-theme="light"] .explanation-text .code-block {
      background: #1e2028;
      border-color: #323541;
      color: #f6f7fb;
    }

    html[data-theme="light"] .review-q-text .inline-code,
    html[data-theme="light"] .explanation-text .inline-code {
      background: #eeeae3;
      border-color: #d2cdc2;
      color: #4c42bd;
    }

    /* ─── MOCKIFY THEME TOGGLE + LIGHT THEME ─── */
    .theme-toggle {
      width: 38px;
      height: 38px;
      min-width: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 50%;
      background: var(--surface2);
      color: var(--text);
      cursor: pointer;
      line-height: 1;
      position: relative;
      isolation: isolate;
      transition: transform .18s ease, border-color .18s ease, background .18s ease, color .18s ease, box-shadow .18s ease;
    }
    .theme-toggle:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
      color: var(--accent);
    }
    .theme-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .theme-toggle .theme-icon {
      width: 17px;
      height: 17px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .theme-toggle .icon-sun { display: none; }
    .theme-toggle .icon-moon { display: block; }

    html[data-theme="light"] {
      color-scheme: light;
      --bg: #f5f3ee;
      --surface: #fffdf9;
      --surface2: #eeece6;
      --border: #d7d3ca;
      --accent: #5548d9;
      --accent2: #c25f78;
      --accent3: #188653;
      --text: #1b1b24;
      --text-dim: #5f6270;
      --text-faint: #7d808d;
      --danger: #c83b55;
      --warn: #9b6700;
      --success: #188653;
      --shadow: 0 12px 34px rgba(33, 31, 25, 0.08);
      --glow: 0 0 44px rgba(85, 72, 217, 0.08);
    }

    html[data-theme="light"] body {
      background: var(--bg);
      color: var(--text);
    }

    html[data-theme="light"] body::before {
      background-image:
        linear-gradient(rgba(85,72,217,0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(85,72,217,0.055) 1px, transparent 1px);
    }

    html[data-theme="light"] .hero-glow {
      background: radial-gradient(ellipse at center, rgba(85,72,217,0.13) 0%, rgba(194,95,120,0.055) 42%, transparent 72%);
    }

    html[data-theme="light"] .btn-primary {
      background: #5548d9;
      color: #fff;
      box-shadow: 0 8px 24px rgba(85,72,217,0.22);
    }
    html[data-theme="light"] .btn-primary:hover {
      background: #493dca;
      box-shadow: 0 10px 28px rgba(85,72,217,0.27);
    }
    html[data-theme="light"] .btn-secondary {
      background: rgba(255,253,249,0.72);
      border-color: var(--border);
      color: var(--text);
      box-shadow: 0 2px 10px rgba(33,31,25,0.03);
    }
    html[data-theme="light"] .btn-secondary:hover {
      background: #fffdf9;
      border-color: rgba(85,72,217,0.45);
      color: var(--accent);
    }

    html[data-theme="light"] .site-nav.scrolled {
      background: rgba(255,253,249,0.86);
      border-bottom-color: rgba(215,211,202,0.9);
      box-shadow: 0 6px 24px rgba(33,31,25,0.04);
    }
    html[data-theme="light"] .site-nav-links a:hover {
      color: var(--text);
      background: rgba(85,72,217,0.06);
    }
    html[data-theme="light"] .mobile-nav {
      background: rgba(245,243,238,0.98);
    }
    html[data-theme="light"] .mobile-nav-links a {
      border-bottom-color: var(--border);
    }

    html[data-theme="light"] .navbar {
      background: rgba(255,253,249,0.9);
      border-bottom-color: rgba(215,211,202,0.9);
      box-shadow: 0 6px 24px rgba(33,31,25,0.045);
    }
    html[data-theme="light"] .nav-pill {
      background: rgba(85,72,217,0.08);
      border-color: rgba(85,72,217,0.2);
      color: var(--accent);
    }
    html[data-theme="light"] .theme-toggle {
      background: #fffdf9;
      box-shadow: 0 3px 12px rgba(33,31,25,0.06);
    }
    html[data-theme="light"] .theme-toggle .icon-sun { display: block; }
    html[data-theme="light"] .theme-toggle .icon-moon { display: none; }

    html[data-theme="light"] .auth-card,
    html[data-theme="light"] .generate-card,
    html[data-theme="light"] .feedback-card,
    html[data-theme="light"] .stat-box,
    html[data-theme="light"] .table-wrap,
    html[data-theme="light"] .score-hero,
    html[data-theme="light"] .review-card,
    html[data-theme="light"] .nav-panel,
    html[data-theme="light"] .question-area {
      background: var(--surface);
      border-color: var(--border);
      box-shadow: var(--shadow);
    }

    html[data-theme="light"] .tab-switcher,
    html[data-theme="light"] .form-group input,
    html[data-theme="light"] .topic-input,
    html[data-theme="light"] .duration-select,
    html[data-theme="light"] .feedback-select,
    html[data-theme="light"] .feedback-textarea,
    html[data-theme="light"] .q-nav-btn,
    html[data-theme="light"] .option-key,
    html[data-theme="light"] .review-q-num,
    html[data-theme="light"] .admin-tabs,
    html[data-theme="light"] .limit-input {
      background: #eeece6;
      border-color: #d2cec4;
      color: var(--text);
    }
    html[data-theme="light"] .form-group input:focus,
    html[data-theme="light"] .topic-input:focus,
    html[data-theme="light"] .feedback-select:focus,
    html[data-theme="light"] .feedback-textarea:focus,
    html[data-theme="light"] .limit-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(85,72,217,0.12);
    }

    html[data-theme="light"] .option-btn {
      background: #eeece6;
      border-color: #d2cec4;
      color: var(--text);
    }
    html[data-theme="light"] .option-btn:hover:not(.selected) {
      border-color: rgba(85,72,217,0.42);
      background: #f3f1ec;
    }
    html[data-theme="light"] .option-btn.selected {
      background: rgba(85,72,217,0.09);
      border-color: var(--accent);
    }
    html[data-theme="light"] .q-nav-btn.answered {
      background: rgba(85,72,217,0.08);
    }
    html[data-theme="light"] .q-nav-btn.current {
      background: var(--accent);
      color: #fff;
    }

    html[data-theme="light"] .score-hero::before {
      background: radial-gradient(circle at 50% 0%, rgba(85,72,217,0.08) 0%, transparent 60%);
    }
    html[data-theme="light"] .review-opt {
      background: #eeece6;
      border-color: #d2cec4;
      color: var(--text);
    }
    html[data-theme="light"] .review-opt.is-correct {
      background: rgba(24,134,83,0.07);
      border-color: rgba(24,134,83,0.28);
    }
    html[data-theme="light"] .review-opt.is-wrong {
      background: rgba(200,59,85,0.07);
      border-color: rgba(200,59,85,0.28);
    }
    html[data-theme="light"] .explanation-box {
      background: rgba(85,72,217,0.055);
      border-color: rgba(85,72,217,0.2);
    }
    html[data-theme="light"] .toast,
    html[data-theme="light"] .modal-box {
      background: var(--surface);
      border-color: var(--border);
      box-shadow: 0 16px 40px rgba(33,31,25,0.14);
    }
    html[data-theme="light"] .modal-overlay {
      background: rgba(35,34,30,0.32);
    }
    html[data-theme="light"] .loading-overlay {
      background: rgba(245,243,238,0.92);
    }

    html[data-theme="light"] th {
      background: #eeece6;
    }
    html[data-theme="light"] td {
      border-bottom-color: rgba(215,211,202,0.75);
    }
    html[data-theme="light"] tr:hover td {
      background: rgba(85,72,217,0.035);
    }

    @media (max-width: 700px) {
      .theme-toggle {
        width: 34px;
        height: 34px;
        min-width: 34px;
      }
      .theme-toggle .theme-icon {
        width: 16px;
        height: 16px;
      }
    }

  </style>
</head>
<body>
  <div class="page">
    <nav class="navbar">
      <a class="nav-logo" href="/">
        <span aria-hidden="true" style="display:inline-flex">
          <svg width="26" height="26" viewBox="0 0 32 32" fill="none">
            <rect width="32" height="32" rx="9" fill="url(#rg1)"/>
            <path d="M9 20V12L16 17L23 12V20" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
            <defs><linearGradient id="rg1" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#6c63ff"/><stop offset="1" stop-color="#ff6584"/></linearGradient></defs>
          </svg>
        </span>
        Mockify
      </a>
      <button type="button" class="theme-toggle" onclick="toggleMockifyTheme()" aria-label="Switch to light mode" title="Switch to light mode" aria-pressed="false">
  <svg class="theme-icon icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.6A8.6 8.6 0 0 1 8.4 3.8 8.6 8.6 0 1 0 20.2 15.6Z"/></svg>
  <svg class="theme-icon icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>
</button>
      <div class="nav-spacer"></div>
    </nav>

    <div class="result-body">
      <div class="score-hero">
        <div class="score-grade" id="result-grade" aria-live="polite">—</div>
        <div class="score-label" id="result-label">Loading your result…</div>
        <div class="result-topic-label" id="result-topic-label"></div>
        <div class="score-stats">
          <div class="score-stat">
            <div class="score-stat-val" id="res-correct" style="color:var(--success)">—</div>
            <div class="score-stat-lbl">Correct</div>
          </div>
          <div class="score-stat">
            <div class="score-stat-val" id="res-wrong" style="color:var(--danger)">—</div>
            <div class="score-stat-lbl">Wrong</div>
          </div>
          <div class="score-stat">
            <div class="score-stat-val" id="res-unanswered" style="color:var(--text-dim)">—</div>
            <div class="score-stat-lbl">Unanswered</div>
          </div>
          <div class="score-stat">
            <div class="score-stat-val" id="res-pct" style="color:var(--accent)">—</div>
            <div class="score-stat-lbl">Score</div>
          </div>
          <div class="score-stat">
            <div class="score-stat-val" id="res-time" style="color:var(--text-dim)">—</div>
            <div class="score-stat-lbl">Time</div>
          </div>
        </div>
      </div>



      <h3 class="section-title">Detailed Review</h3>
      <div id="error-box" class="error-box"></div>
      <div id="questions-review" class="questions-review"></div>

      <div class="result-actions">
        <button type="button" class="btn btn-secondary" onclick="window.location.href='/'">← Dashboard</button>
        <button type="button" class="btn btn-primary" onclick="window.location.href='/'">Take Another Mock</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const API = '/api';

    function escapeHtml(s) {
      if (s == null) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function renderRichText(value) {
      const source = String(value == null ? '' : value)
        .replace(/\r\n/g, '\n')
        .replace(/\r/g, '\n');

      const chunks = source.split(/(```[^\n]*\n[\s\S]*?```)/g);

      return chunks.map(chunk => {
        const fenced = chunk.match(/^```([^\n]*)\n([\s\S]*?)```$/);

        if (fenced) {
          const language = escapeHtml(fenced[1].trim());
          const code = fenced[2].replace(/\n$/, '');

          return `
            <pre class="code-block"${language ? ` data-language="${language}"` : ''}><code>${escapeHtml(code)}</code></pre>
          `;
        }

        let html = escapeHtml(chunk);

        html = html.replace(
          /`([^`\n]+)`/g,
          '<code class="inline-code">$1</code>'
        );

        return html.replace(/\n/g, '<br>');
      }).join('');
    }

    function formatTime(sec) {
      const total = Number(sec || 0);
      const m = Math.floor(total / 60);
      const s = total % 60;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    async function apiCall(path) {
      const res = await fetch(API + path, {
        method: 'GET',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include'
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Request failed');
      return data;
    }

    function renderResults(data) {
      const pct = Number(data.percentage || 0);
      const gradeEl = document.getElementById('result-grade');
      gradeEl.textContent = `0/${data.total}`;
      gradeEl.className = 'score-grade ' + (pct >= 80 ? 'excellent' : pct >= 60 ? 'good' : pct >= 40 ? 'average' : 'poor');
  const labels = { excellent: 'Outstanding', good: 'Great job', average: 'Keep practicing', poor: 'Study more' };
      document.getElementById('result-label').textContent = pct >= 80 ? labels.excellent : pct >= 60 ? labels.good : pct >= 40 ? labels.average : labels.poor;
      document.getElementById('result-topic-label').textContent = `Topic: ${data.topic}`;
      animateNumber(gradeEl, data.score, data.total, (value) => `${value}/${data.total}`);
      animateNumber(document.getElementById('res-correct'), Number(data.correct_answers || 0));
      animateNumber(document.getElementById('res-wrong'), Number(data.wrong_answers || 0));
      animateNumber(document.getElementById('res-unanswered'), Number(data.unanswered_answers || 0));
      animateNumber(document.getElementById('res-pct'), pct, null, (value) => `${value}%`);
      document.getElementById('res-time').textContent = formatTime(data.time_taken);

      const review = document.getElementById('questions-review');
      review.innerHTML = (data.detailed || []).map((q, i) => {
        const cls = q.is_unanswered || q.user_answer == null ? 'unanswered' : q.is_correct ? 'correct' : 'incorrect';
        const opts = ['A', 'B', 'C', 'D'].map(k => {
          let optCls = '';
          if (k === q.correct_answer) optCls = 'is-correct';
          else if (k === q.user_answer && q.is_wrong) optCls = 'is-wrong';
          return `<div class="review-opt ${optCls}">
            <span class="review-opt-key">${k}</span>
            <span>${renderRichText(q.options[k])}</span>
            ${k === q.correct_answer ? ' &check;' : ''}
            ${k === q.user_answer && q.is_wrong ? ' &times;' : ''}
          </div>`;
        }).join('');
        const explanationHtml = q.is_wrong ? `
          <div class="explanation-box">
            <div class="explanation-title">Explanation</div>
            <div class="explanation-text">${renderRichText(q.explanation || 'Explanation is unavailable for this question.')}</div>
            <div class="your-answer-line">Your answer: <strong>${escapeHtml(q.user_answer)}</strong> · Correct answer: <strong>${escapeHtml(q.correct_answer)}</strong></div>
          </div>` : q.is_unanswered ? `
          <div class="explanation-box">
            <div class="explanation-title">Unanswered question</div>
            <div class="explanation-text">You did not answer this question. Review the correct answer below.</div>
            <div class="your-answer-line">Correct answer: <strong>${escapeHtml(q.correct_answer)}</strong></div>
          </div>` : '';

        const status = q.is_unanswered || q.user_answer == null ? 'Unanswered' : q.is_correct ? 'Correct' : 'Incorrect';
        return `<article class="review-card ${cls}" aria-label="Question ${i + 1}: ${status}">
          <div class="review-q-head">
            <div class="review-q-num">${i + 1}</div>
            <div class="review-q-text">${renderRichText(q.question)}</div>
          </div>
          <div class="review-options">${opts}</div>
          ${explanationHtml}
        </article>`;
      }).join('');
      document.querySelector('.score-hero').classList.add('is-ready');
    }

    function animateNumber(element, target, denominator, formatter) {
      const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const duration = reduce ? 0 : 480;
      const start = performance.now();
      const render = (now) => {
        const progress = duration ? Math.min(1, (now - start) / duration) : 1;
        const value = Math.round(target * (1 - Math.pow(1 - progress, 3)));
        element.textContent = formatter ? formatter(value) : value;
        if (progress < 1) requestAnimationFrame(render);
      };
      requestAnimationFrame(render);
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message; toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 2800);
    }

    function showError(message) {
      const box = document.getElementById('error-box');
      box.textContent = message;
      box.style.display = 'block';
    }

    function guardBackToDashboard() {
      try {
        history.replaceState({ mockifyResultPage: true }, '', window.location.href);
        history.pushState({ mockifyResultPage: true }, '', window.location.href);
      } catch (e) {}

      window.addEventListener('popstate', function () {
        window.location.replace('/');
      }, { once: true });
    }

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const resultId = params.get('result_id');
      const stored = sessionStorage.getItem('mockify_latest_result');

      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          if (!resultId || String(parsed.result_id) === String(resultId)) {
            renderResults(parsed);
            sessionStorage.removeItem('mockify_latest_result');
            guardBackToDashboard();
            return;
          }
        } catch (e) {}
      }

      if (!resultId) {
        showError('No result selected. Go back to the dashboard and open a result.');
        return;
      }

      try {
        const data = await apiCall(`/results/${resultId}`);
        renderResults(data);
        guardBackToDashboard();
      } catch (e) {
        showError("We couldn't load this result right now. Check your connection and try again from your dashboard.");
      }
    }

    init();
  </script>

<script>
(function () {
  function getTheme() {
    return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  }

  function updateThemeUI() {
    const light = getTheme() === 'light';
    document.querySelectorAll('.theme-toggle').forEach(function (button) {
      button.setAttribute('aria-pressed', String(light));
      button.setAttribute('aria-label', light ? 'Switch to dark mode' : 'Switch to light mode');
      button.setAttribute('title', light ? 'Switch to dark mode' : 'Switch to light mode');
    });
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', light ? '#f5f3ee' : '#0a0a0f');
  }

  window.toggleMockifyTheme = function () {
    const next = getTheme() === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('mockify-theme', next); } catch (e) {}
    updateThemeUI();
  };

  window.updateMockifyThemeUI = updateThemeUI;
  updateThemeUI();
})();
</script>

</body>
</html>
